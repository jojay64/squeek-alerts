name: alerts

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      test:
        description: "Send one test message to Telegram/Discord"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: alerts
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run tests
        run: node --test test.mjs
      - name: Check the hamster
        run: node alert.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          TEST_ALERT: ${{ inputs.test && '1' || '0' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      - name: Save state
        run: |
          git config user.name "squeek-alerts[bot]"
          git config user.email "actions@users.noreply.github.com"
          git add state.json events.json feed.xml
          git diff --cached --quiet || (git commit -m "chore: update alert state" && git push)
